services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-form-builder:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "${APP_URL:-http://localhost:8000}"
      APP_KEY: "${APP_KEY:-}"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-formbuilder}"
      DB_USERNAME: "${DB_USERNAME:-formbuilder}"
      DB_PASSWORD: "${DB_PASSWORD:-formbuilder}"
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: database
      AI_DRIVER: "${AI_DRIVER:-mock}"
      AI_BASE_URL: "${AI_BASE_URL:-https://api.openai.com/v1}"
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_MODEL: "${AI_MODEL:-gpt-4o-mini}"
      APP_SEED: "${APP_SEED:-true}"
    volumes:
      - formbuilder_storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-formbuilder}"
      MYSQL_USER: "${DB_USERNAME:-formbuilder}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-formbuilder}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root}"
    volumes:
      - formbuilder_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  formbuilder_storage:
  formbuilder_mysql:
